   INPUT
   ============================================================ */
function tileFromEvent(e){
  const b=cv.getBoundingClientRect();
  const x=(e.clientX-b.left)-TS/2, y=(e.clientY-b.top)-HR();
  const R=HR();
  const fq=(SQ3/3*x-y/3)/R, fr=(2/3*y)/R;
  // cube-round the fractional axial coordinate to the nearest hex centre
  let rx=Math.round(fq), rz=Math.round(fr), ry=Math.round(-fq-fr);
  const dx=Math.abs(rx-fq), dz=Math.abs(rz-fr), dy=Math.abs(ry-(-fq-fr));
  if(dx>dy&&dx>dz) rx=-ry-rz; else if(dy<=dz) rz=-rx-ry;
  const [c,r]=toOff(rx,rz);
  return inB(c,r)?[c,r]:null;
}
let downPt=null, downRect=null, downT=0;
function onDown(e){ downPt=[e.clientX,e.clientY]; downT=performance.now(); downRect=cv.getBoundingClientRect(); G.box=null; }
function onMove(e){
  if(!downPt||G.phase!=="battle"||G.armed) return;
  if(Math.hypot(e.clientX-downPt[0],e.clientY-downPt[1])<14) return;
  G.box={x0:downPt[0]-downRect.left,y0:downPt[1]-downRect.top,
         x1:e.clientX-downRect.left,y1:e.clientY-downRect.top};
}
function onUp(e){
  if(!downPt) return;
  const moved=Math.hypot(e.clientX-downPt[0],e.clientY-downPt[1]); downPt=null;
  if(G.box){
    const b=G.box, x0=Math.min(b.x0,b.x1), x1=Math.max(b.x0,b.x1);
    const y0=Math.min(b.y0,b.y1), y1=Math.max(b.y0,b.y1);
    G.box=null;
    const got=myUnits().filter(u=>{ const [x,y]=upos(u); return x>=x0-TS*.3&&x<=x1+TS*.3&&y>=y0-TS*.3&&y<=y1+TS*.3; });
    setSel(got);
    toast(got.length?got.length+" selected":"Nothing in the box");
    return;
  }
  if(moved>14) return;
  const t=tileFromEvent(e); if(!t) return;
  const [c,r]=t;
  if(G.phase==="deploy") return deployTap(c,r);
  if(performance.now()-downT>=450){ G.lastTap=null; return holdTap(c,r); }
  battleTap(c,r);
}

function setHolding(list){
  for(const u of list){
    u.holding=true; u.holdOnArrive=false;
    u.target=null; u.auto=false; u.goal=null; u.path=null; u.pathGoal=null;
    u.anchor=[u.c,u.r];
    fx({t:"ping",c:u.c,r:u.r,life:.5,col:"#8fd0ff"});
  }
}
// Long press: on one of your own units it plants them where they stand; on open
// ground it sends the selection there and plants them on arrival.
function holdTap(c,r){
  const sel=selLive(), hit=unitAt(c,r);
  if(hit&&hit.side===YOU){
    const list=(sel.includes(hit)&&sel.length>1)?sel:[hit];
    setSel(list); setHolding(list);
    return toast(list.length>1?list.length+" holding position":hit.t.name+" holds position");
  }
  if(!sel.length) return toast("Select someone first");
  if(isRock(c,r)) return;
  groupMove(sel,c,r);
  for(const u of sel) u.holdOnArrive=true;
  toast(sel.length>1?"Moving to hold":"Moving, then holding");
}

function battleTap(c,r){
  const hit=unitAt(c,r), one=selOne(), ty=selType();

  // ability targeting
  if(G.armed&&ty&&G.sel.length){
    const a=T[ty].ab;
    if(a.kind==="ally"&&(!hit||hit.side!==YOU)) return toast(a.name+" needs an ally");
    if(a.kind==="enemy"&&(!hit||hit.side!==FOE)) return toast(a.name+" needs an enemy");
    if(a.kind==="unit"&&!hit) return toast(a.name+" needs a body to throw");
    const casters=G.sel.filter(u=>u.abCd<=0);
    if(!casters.length) return toast(a.name+" is not ready");
    const far=casters.filter(u=>dist(c,r,u.c,u.r)>a.range).length;
    casters.forEach(u=>order(u,{k:"ability",c,r,id:hit?hit.id:null}));
    if(far) toast(far===casters.length?"Moving into range":far+" moving into range");
    G.armed=null; syncUI(); return;
  }

  // tapping your own unit
  if(hit&&hit.side===YOU){
    const now=performance.now();
    if(G.lastTap&&G.lastTap.id===hit.id&&now-G.lastTap.t<340){
      G.lastTap=null;
      if(hit.t.king){ const all=myUnits(); setSel(all); return toast("Everyone — "+all.length); }
      const kin=myUnits().filter(u=>u.type===hit.type);
      setSel(kin); toast("All "+T[hit.type].name+"s — "+kin.length);
      return;
    }
    G.lastTap={id:hit.id,t:now};
    setSel([hit]); return;
  }

  if(!selLive().length) return;
  if(hit&&hit.side===FOE) G.sel.forEach(u=>order(u,{k:"attack",id:hit.id}));
  else if(!isRock(c,r)) groupMove(G.sel,c,r);
}

function deployTap(c,r){
  const hit=unitAt(c,r);
  if(hit&&hit.side===YOU&&hit.t.king){
    G.placing="king"; renderRoster(); return toast("Tap a home hex to move your commander");
  }
  if(hit&&hit.side===YOU){
    G.budget+=hit.t.cost; G.units=G.units.filter(u=>u!==hit); renderRoster(); return;
  }
  if(!G.placing) return toast("Pick a unit below first");
  if(r<6) return toast("Deploy in the bottom three rows");
  if(isRock(c,r)||hit) return;
  if(G.placing==="king"){
    const k=king(YOU); k.c=c; k.r=r; G.placing=null; renderRoster(); return;
  }
  const t=T[G.placing];
  if(t.cost>G.budget) return toast("Not enough points");
  spawn(YOU,G.placing,c,r); G.budget-=t.cost;
  if(T[G.placing].cost>G.budget) G.placing=null;
  renderRoster();
}

/* ============================================================
   UI
   ============================================================ */
const $=id=>document.getElementById(id);
function renderRoster(){
  const el=$("roster"); el.innerHTML="";
  for(const k of ROSTER){
    const t=T[k];
    const d=document.createElement("button");
    d.className="chip"+(G.placing===k?" on":"")+(t.cost>G.budget?" dim":"");
    d.innerHTML='<div class="g"><canvas width="44" height="44" style="width:22px;height:22px"></canvas></div>'+
      '<div class="n">'+t.name+'</div><div class="c">'+t.cost+'</div>';
    const cc=d.querySelector("canvas").getContext("2d"); cc.scale(2,2);
    const oc=cx; cx=cc; glyph(k,11,11,7,"#f6d894"); cx=oc;
    d.onclick=()=>{ G.placing=G.placing===k?null:k; renderRoster(); toast(t.name+" — "+t.blurb); };
    el.appendChild(d);
  }
  $("pts").textContent=G.budget;
  $("startBtn").disabled = !G.units.some(u=>u.side===YOU&&!u.t.king);
}

let toastT;
function toast(m){ const e=$("toast"); e.textContent=m; e.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove("show"),1900); }

function syncUI(){
  const a=king(YOU), b=king(FOE);
  $("youFill").style.width=(a?a.hp/a.max*100:0)+"%"; $("youNum").textContent=a?Math.ceil(a.hp):0;
  $("foeFill").style.width=(b?b.hp/b.max*100:0)+"%"; $("foeNum").textContent=b?Math.ceil(b.hp):0;
  const m=Math.max(0,G.timeLeft);
  $("clock").textContent=Math.floor(m/60)+":"+String(Math.floor(m%60)).padStart(2,"0");
  $("focusmeter").firstElementChild.style.width=G.focus+"%";
  $("focusbtn").classList.toggle("on",G.focusOn);

  if(G.phase!=="battle") return;
  const sel=selLive(), ab=$("ability"), ty=selType();
  const sig=sel.map(u=>u.id).join(",");
  if(sig!==G.selSig){ G.selSig=sig; renderPills(sel); renderBands(); }

  if(!sel.length){
    $("cardName").textContent="No unit selected";
    $("cardStat").textContent="Tap a unit, or drag a box across several";
    ab.className="cool"; ab.querySelector(".an").textContent="—"; ab.querySelector(".ad").textContent="no ability";
    return;
  }
  if(sel.length===1){
    const s=sel[0];
    $("cardName").textContent=s.t.name;
    $("cardStat").textContent=Math.ceil(s.hp)+"/"+s.max+" hp · "+s.t.dmg+" dmg · range "+s.t.rng
      +(s.shield>0?" · +"+Math.ceil(s.shield)+" shield":"")+(s.holding?" · holding":"");
  } else {
    const hp=sel.reduce((a,u)=>a+u.hp,0), mx=sel.reduce((a,u)=>a+u.max,0);
    const held=sel.filter(u=>u.holding).length;
    $("cardName").textContent = ty ? sel.length+" "+T[ty].name+"s" : "Squad · "+sel.length;
    $("cardStat").textContent = Math.round(hp/mx*100)+"% strength"+(held?" · "+held+" holding":" · tap a badge for one unit");
  }

  if(!ty){
    ab.className="cool"; ab.querySelector(".an").textContent="Mixed";
    ab.querySelector(".ad").textContent="same type to cast"; return;
  }
  const A=T[ty].ab, ready=sel.filter(u=>u.abCd<=0).length;
  const queued=sel.filter(u=>u.castPend).length;
  if(G.armed){
    ab.className="arm";
    ab.querySelector(".an").textContent="Cancel";
    ab.querySelector(".ad").textContent="or pick a target";
  } else if(queued){
    ab.className="arm";
    ab.querySelector(".an").textContent="Cancel";
    ab.querySelector(".ad").textContent=A.name+" — closing in";
  } else {
    ab.querySelector(".an").textContent=A.name;
    if(!ready){
      const soon=Math.min(...sel.map(u=>u.abCd));
      ab.className="cool"; ab.querySelector(".ad").textContent=soon.toFixed(1)+"s";
    } else { ab.className=""; ab.querySelector(".ad").textContent = sel.length>1 ? ready+" of "+sel.length+" ready" : A.desc; }
  }
}

function renderPills(sel){
  const el=$("pills"); el.innerHTML="";
  if(sel.length<2) return;
  for(const u of sel){
    const p=document.createElement("button");
    p.className="pill"+(u.hp/u.max<.4?" hurt":"");
    p.innerHTML='<canvas width="40" height="40" style="width:20px;height:20px"></canvas><i><b style="width:'+(u.hp/u.max*100)+'%"></b></i>';
    const cc=p.querySelector("canvas").getContext("2d"); cc.scale(2,2);
    const oc=cx; cx=cc; glyph(u.type,10,9,6.5,"#f6d894"); cx=oc;
    p.onclick=()=>{ setSel([u]); toast(u.t.name+" only"); };
    el.appendChild(p);
  }
}

function renderBands(){
  const el=$("bands"); el.innerHTML="";
  const all=document.createElement("button");
  all.className="band wide"+(G.sel.length&&G.sel.length===myUnits().length?" on":"");
  all.textContent="All";
  all.onclick=()=>{ const u=myUnits(); setSel(u); toast(u.length+" selected"); };
  el.appendChild(all);

  G.bands.forEach((ids,i)=>{
    const live=ids.map(byId).filter(Boolean);
    const on=live.length&&live.length===G.sel.length&&live.every(u=>G.sel.includes(u));
    const btn=document.createElement("button");
    btn.className="band"+(live.length?" full":"")+(on?" on":"");
    btn.innerHTML=(i+1)+(live.length?'<em>'+live.length+'</em>':'<em>+</em>');
    let held=false,timer=null;
    const assign=()=>{ if(!G.sel.length) return toast("Select units first, then hold a band");
      G.bands[i]=G.sel.map(u=>u.id); renderBands(); toast("Band "+(i+1)+" set — "+G.sel.length+" units"); };
    btn.addEventListener("pointerdown",()=>{ held=false; timer=setTimeout(()=>{held=true;assign();},420); });
    btn.addEventListener("pointerup",()=>{ clearTimeout(timer); if(held) return;
      if(!live.length) return assign();
      setSel(live); toast("Band "+(i+1)+" — "+live.length+" units"); });
    btn.addEventListener("pointerleave",()=>clearTimeout(timer));
    btn.addEventListener("pointercancel",()=>clearTimeout(timer));
    el.appendChild(btn);
  });
}

function finish(){
  G.phase="done";
  const won=G.over==="win";
  const alive=G.units.filter(u=>u.side===YOU&&u.hp>0&&!u.t.king).length;
  const why={king:won?"enemy commander cut down":"your commander has fallen",
             wipe:won?"their army annihilated":"your army annihilated",
             time:won?"ahead when the clock ran out":"behind when the clock ran out",
             quit:"surrendered"}[G.overWhy||"king"];
  const tips=[
    "A commander is slow but not harmless — a spare body in a won fight.",
    "Rally clears every nearby order cooldown. Save it for the moment you need three things at once.",
    "Units only attack standing still — a retreat costs you damage. Decide early, not late.",
    "Archers do half damage point-blank. Keep a body in front of them."];
  showSheet(`
    <div class="title" style="color:${won?'var(--brass)':'var(--amethyst)'}">${won?"Line Held":"Line Broken"}</div>
    <div class="sub">${why}</div>
    <div class="rule"></div>
    <p class="p">${won
      ? `You finished with <b>${alive}</b> unit${alive===1?"":"s"} standing at <b>${Math.floor(Math.max(0,G.timeLeft)/60)}:${String(Math.floor(Math.max(0,G.timeLeft)%60)).padStart(2,"0")}</b> on the clock.`
      : tips[(Math.random()*tips.length)|0]}</p>
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="restart()">Play again</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="menu()">Main menu</button>`);
}

function showSheet(html){ $("sheet").innerHTML=html; $("ov").classList.remove("hide"); }
function hideSheet(){ $("ov").classList.add("hide"); }

let diff=1;
function menu(){
  showSheet(`
    <div class="title">Gambit<br>Line</div>
    <div class="sub">a chess-shaped micro rts</div>
    <div class="rule"></div>
    <p class="p">Draft an army around your <b>Commander</b> and place it on your three home ranks, then fight in real time. <b>No bases, no economy</b> — every decision is a unit decision.</p>
    <p class="p">Orders are on a <b>cooldown, not a race</b>. Spamming taps does nothing; ordering the right unit at the right moment does everything.</p>
    <h3>Difficulty</h3>
    <p class="p" style="font-size:11.5px;margin-bottom:2px">Recruit fights unit by unit and keeps its commander home. Veteran concentrates fire and brings the commander up behind the line. Warlord puts it <em>in</em> the line, pulls wounded units out, and retreats the commander the moment you focus it.</p>
    <div class="diffrow">
      <button class="btn ${diff===0?'on':''}" onclick="setDiff(0)">Recruit</button>
      <button class="btn ${diff===1?'on':''}" onclick="setDiff(1)">Veteran</button>
      <button class="btn ${diff===2?'on':''}" onclick="setDiff(2)">Warlord</button>
    </div>
    <button class="btn primary" style="width:100%;margin-top:16px" onclick="begin()">Draft army</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="rules()">How it plays</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="toggleSkin('menu')">Board: ${skinLabel()}</button>`);
}
function setDiff(d){ diff=d; menu(); }
function toggleSkin(from){
  SKIN_NAME = SKIN_NAME==="dusk" ? "day" : "dusk";
  toast(SKIN_NAME==="day" ? "Daylight — built for direct sun" : "Dusk — the darker board");
  if(from==="menu") menu(); else if(from==="pause") pause();
}
const skinLabel=()=>SKIN_NAME==="day" ? "Daylight contrast" : "Dusk (darker)";

/* ---------- pause / surrender / restart ---------- */
function pause(){
  if(!G||G.phase==="done") return menu();
  if(G.phase==="deploy"){
    showSheet(`
      <div class="title" style="font-size:22px">Paused</div>
      <div class="sub">drafting — nothing lost yet</div>
      <div class="rule"></div>
      <button class="btn primary" style="width:100%" onclick="resume()">Back to draft</button>
      <button class="btn" style="width:100%;margin-top:8px" onclick="restart()">Clear and redraft</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="toggleSkin('pause')">Board: ${skinLabel()}</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="rules('pause')">How it plays</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="menu()">Main menu</button>`);
    return;
  }
  G.paused=true;
  const alive=G.units.filter(u=>u.side===YOU&&u.hp>0).length;
  const foe=G.units.filter(u=>u.side===FOE&&u.hp>0).length;
  showSheet(`
    <div class="title" style="font-size:22px">Paused</div>
    <div class="sub">${alive} yours · ${foe} theirs</div>
    <div class="rule"></div>
    <p class="p">The clock is stopped. Nothing moves until you resume.</p>
    <button class="btn primary" style="width:100%" onclick="resume()">Resume battle</button>
    <button class="btn" style="width:100%;margin-top:8px" onclick="restart()">Restart — new draft</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="toggleSkin('pause')">Board: ${skinLabel()}</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="rules('pause')">How it plays</button>
    <button class="btn danger" style="width:100%;margin-top:14px" onclick="confirmSurrender()">Surrender</button>`);
}
function resume(){ if(G) G.paused=false; hideSheet(); }
function confirmSurrender(){
  showSheet(`
    <div class="title" style="font-size:22px">Surrender?</div>
    <div class="sub">this counts as a loss</div>
    <div class="rule"></div>
    <p class="p">Your army lays down arms and the battle ends here. You can draft a fresh one right after.</p>
    <button class="btn danger" style="width:100%" onclick="doSurrender()">Yes, surrender</button>
    <button class="btn primary" style="width:100%;margin-top:8px" onclick="pause()">Keep fighting</button>`);
}
function doSurrender(){
  for(const u of G.units) if(u.side===YOU) u.hp=0;
  G.paused=false; G.over="lose"; G.overWhy="quit"; finish();
}

function rules(back){
  showSheet(`
    <div class="title" style="font-size:22px">How it plays</div>
    <div class="rule"></div>
    <div class="kv"><i>Select</i><span>Tap a unit. Drag a box to grab several. Double-tap to grab every unit of that type.</span></div>
    <div class="kv"><i>Sunlight</i><span>Playing outside? Switch the board to <b>Daylight</b> from the Menu — it trades the dark palette for raw contrast.</span></div>
    <div class="kv"><i>Keyboard</i><span>On a desktop: <b>Q</b> ability, <b>Space</b> focus, <b>A</b> select all, <b>1–3</b> squad bands, <b>H</b> hold position, <b>C</b> board contrast, <b>right-click</b> or <b>Esc</b> to cancel.</span></div>
    <div class="kv"><i>Bands</i><span>Hold a numbered band to save the current squad; tap it to call them back. <b>All</b> grabs everything.</span></div>
    <div class="kv"><i>Move</i><span>Tap an empty hex. A whole group heads for the same hex and packs in around it — no formation slots. Units stop on their own once a target is in reach.</span></div>
    <div class="kv"><i>On their own</i><span>An idle unit engages anything that comes within one hex of its reach, but only chases <b>3 hexes from where you left it</b> — then it walks back. Order an attack yourself and there is no leash at all.</span></div>
    <div class="kv"><i>Charge</i><span>A Rider's Charge is a sprint, not a leap — it runs at nearly double pace and the <b>next blow it lands</b> hits for extra and stuns. Close the distance yourself; the hit keeps until you connect.</span></div>
    <div class="kv"><i>Hold</i><span><b>Long-press</b> a unit to plant it where it stands: it stops chasing and shoots only what walks into range. Long-press open ground instead and the selection marches there and holds on arrival. Any normal order lifts the stance. Braced feet under a unit mean it is holding.</span></div>
    <div class="kv"><i>Pursuit</i><span>A unit locked onto an enemy it cannot yet reach breaks into a run — about a third faster — so melee can close on something that is backing away.</span></div>
    <div class="kv"><i>Focus fire</i><span>Tap an enemy to send the whole selection onto it. Concentrated damage wins fights — this is the whole game.</span></div>
    <div class="kv"><i>Abilities</i><span>Available when everyone selected is the same type — then it fires for all of them. Tap a badge on the card to drop back to one unit.</span></div>
    <div class="kv"><i>Out of reach</i><span>Aim past an ability's range and the unit walks into range and casts on arrival, following the target if it moves. The button turns into <b>Cancel</b> — tap it to call the whole thing off.</span></div>
    <div class="kv"><i>Order ring</i><span>After each order a gold ring runs down. Orders given during it are <b>queued</b>, not lost.</span></div>
    <div class="kv"><i>Focus</i><span>The right-hand button slows time to a third. Use it to read a fight, not to escape one — the meter drains fast.</span></div>
    <div class="kv"><i>Win</i><span>Cut down the enemy <b>Commander</b>, or wipe their army. At 0:00 the healthier Commander takes it.</span></div>
    <div class="kv"><i>Commander</i><span>A real unit, yours to move and place. <b>Rally</b> reaches 3 tiles to heal allies and clear their order cooldowns — including a Taunt — so it has to travel with the line. Lose it and you lose.</span></div>
    <h3>Where you stand</h3>
    <div class="kv"><i>Wind-up</i><span>A blow takes a moment to land — you can see the arc close in on its target. <b>Move during the wind-up and the swing is thrown away.</b> Standing still never costs you rate of fire; only interrupting yourself does.</span></div>
    <div class="kv"><i>Standstill</i><span>Units only attack while stopped. Moving costs damage, so a retreat is a real decision — not a free one.</span></div>
    <div class="kv"><i>Point blank</i><span>Archers, Seers and Snares do <b>half damage</b> to anything adjacent. Screen them.</span></div>
    <div class="kv"><i>Line of sight</i><span>Shooters need a clear line. <b>Enemy bodies and rocks block it; your own never do</b> — so a front rank shields your archers from return fire without ever getting in their way. A selected unit only lights up the hexes it can actually hit.</span></div>
    <div class="kv"><i>Hexes</i><span>All six neighbours are one step away and a range is a true circle, so reach is honest in every direction.</span></div>

    <h3>Reading the board</h3>
    <div class="kv"><i>Green ring</i><span>Absorb shield (Ward)</span></div>
    <div class="kv"><i>Blue dashes</i><span>Damage reduction</span></div>
    <div class="kv"><i>Red dashes</i><span>Taunted — locked onto a Warden and takes no orders until it wears off. A <b>Shove</b> or a <b>Rally</b> breaks it.</span></div>
    <div class="kv"><i>Corner dial</i><span>Every unit's ability cooldown, yours and theirs — it fills as the ability recharges and pulses when ready</span></div>
    <div class="kv"><i>Red square</i><span>Rupture landing here in 0.8s — move</span></div>
    <button class="btn primary" style="width:100%;margin-top:16px" onclick="${back==='pause'?'pause()':'menu()'}">Back</button>`);
}
function begin(){ newGame(diff); hideSheet(); $("deployUI").style.display=""; $("battleUI").style.display="none"; fit(); }
function restart(){ begin(); toast("Fresh enemy army — draft again"); }

function autoFill(){
  G.units=G.units.filter(u=>u.side!==YOU||u.t.king); G.budget=12;
  const plan=["warden","spear","archer","mender"], slots=[[3,7],[2,7],[3,8-0],[4,7]];
  const spots=[[3,7],[2,7],[4,7],[1,7],[5,7],[2,8],[4,8]];
  let i=0;
  for(const p of plan){ if(T[p].cost>G.budget) continue;
    let s=spots[i++]; while(s&&(occAt(s[0],s[1])||isRock(s[0],s[1]))) s=spots[i++];
    if(!s) break; spawn(YOU,p,s[0],s[1]); G.budget-=T[p].cost; }
  G.placing=null; renderRoster();
}

/* ---------- wiring ---------- */
window.addEventListener("load",()=>{
  cv=$("cv"); cx=cv.getContext("2d");
  cv.addEventListener("pointerdown",onDown);
  cv.addEventListener("pointermove",onMove);
  cv.addEventListener("pointerup",onUp);
  cv.addEventListener("pointercancel",()=>{downPt=null;G.box=null;});
  cv.addEventListener("contextmenu",e=>{
    e.preventDefault();
    if(G.armed){ G.armed=null; syncUI(); return toast("Cancelled"); }
    const q=G.sel.filter(u=>u.castPend);
    if(q.length){ q.forEach(cancelCast); syncUI(); toast("Cast called off"); }
  });
  window.addEventListener("keydown",e=>{
    if(e.repeat||!G) return;
    const open=!$("ov").classList.contains("hide");
    if(e.key==="Escape"){
      e.preventDefault();
      if(open){ if(G.paused) resume(); return; }
      if(G.armed){ G.armed=null; syncUI(); return toast("Cancelled"); }
      const q=G.sel.filter(u=>u.castPend);
      if(q.length){ q.forEach(cancelCast); syncUI(); return toast("Cast called off"); }
      pause(); return;
    }
    if(open||G.phase!=="battle") return;
    const k=e.key.toLowerCase();
    if(k===" "||e.code==="Space"){ e.preventDefault(); $("focusbtn").click(); }
    else if(k==="q"){ e.preventDefault(); $("ability").click(); }
    else if(k==="a"){ const all=myUnits(); setSel(all); toast(all.length+" selected"); }
    else if(k==="c"){ toggleSkin(); }
    else if(k==="h"){ const sel=selLive(); if(sel.length){ setHolding(sel); syncUI();
      toast(sel.length>1?sel.length+" holding position":"Holding position"); } }
    else if(k>="1"&&k<="3"){
      const i=+k-1, live=G.bands[i].map(byId).filter(Boolean);
      if(live.length){ setSel(live); toast("Band "+k+" — "+live.length); }
      else if(G.sel.length){ G.bands[i]=G.sel.map(u=>u.id); renderBands(); toast("Band "+k+" set"); }
    }
  });
  $("startBtn").onclick=()=>{ G.phase="battle"; G.placing=null; G.selSig="x"; 
    $("deployUI").style.display="none"; $("battleUI").style.display="";
    renderBands(); syncUI();
    setTimeout(fit,0); toast("Drag a box to grab a squad"); };
  $("clearBtn").onclick=()=>{ G.units=G.units.filter(u=>u.side!==YOU||u.t.king); G.budget=12; G.placing=null; renderRoster(); };
  $("autoBtn").onclick=autoFill;
  $("menuBtn").onclick=pause;
  $("ability").onclick=()=>{
    const ty=selType(); if(!ty||!G.sel.length) return;
    if(G.armed){ G.armed=null; syncUI(); return toast("Cancelled"); }
    const queued=G.sel.filter(u=>u.castPend);
    if(queued.length){ queued.forEach(cancelCast); syncUI(); return toast("Cast called off"); }
    const A=T[ty].ab, ready=G.sel.filter(u=>u.abCd<=0);
    if(!ready.length) return;
    if(A.kind==="self") ready.forEach(u=>order(u,{k:"ability",c:u.c,r:u.r}));
    else G.armed=true;
    syncUI(); };
  $("focusbtn").onclick=()=>{ if(!G.focusOn&&G.focus<12) return toast("Focus is spent — it refills");
    G.focusOn=!G.focusOn; syncUI(); };
  window.addEventListener("resize",()=>setTimeout(fit,60));
  window.addEventListener("orientationchange",()=>setTimeout(fit,120));
  // the panel often has no size on first paint; refit the moment it gets one
  if(window.ResizeObserver) new ResizeObserver(()=>fit()).observe($("stage"));
  newGame(1); fit(); menu(); loop();
});

let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const raw=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(!G) return;
  if(!G.paused){
    if(G.focusOn){ G.focus-=raw*26; if(G.focus<=0){G.focus=0;G.focusOn=false;} }
    else G.focus=Math.min(100,G.focus+raw*8);
    update(raw*(G.focusOn?.32:1));
  }
  draw();
}
</script>
</body>
</html>
